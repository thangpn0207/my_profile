<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Senior Flutter Engineer Profile - Pham Ngoc Thang">

  <!-- Mobile meta tags & icons -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pham Ngoc Thang">

  <link rel="icon" type="image/png" href="dragon.png" />
  <title>Pham Ngoc Thang | Senior Flutter Engineer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0B0B0F;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: 'Courier New', Courier, monospace;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loader-box {
      position: relative;
      width: 120px;
      height: 120px;
      border: 2px solid #FFD700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .loader-box::before {
      content: "";
      position: absolute;
      width: calc(100% + 10px);
      height: calc(100% + 10px);
      border: 1px solid rgba(255, 215, 0, 0.1);
      animation: rotate 4s linear infinite;
    }

    .inner-square {
      width: 60px;
      height: 60px;
      background-color: #FFD700;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .loader-text {
      color: #FFD700;
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      animation: flicker 2s infinite;
    }

    .progress-bar {
      width: 200px;
      height: 2px;
      background: rgba(255, 215, 0, 0.1);
      margin-top: 15px;
      position: relative;
      overflow: hidden;
    }

    .progress-inner {
      position: absolute;
      height: 100%;
      width: 50%;
      background: #FFD700;
      box-shadow: 0 0 10px #FFD700;
      animation: moveProgress 2s linear infinite;
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(0.8);
        opacity: 0.5;
      }

      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes flicker {

      0%,
      19%,
      21%,
      23%,
      25%,
      54%,
      56%,
      100% {
        opacity: 1;
      }

      20%,
      22%,
      24%,
      55% {
        opacity: 0.5;
      }
    }

    @keyframes moveProgress {
      0% {
        left: -50%;
      }

      100% {
        left: 100%;
      }
    }

    /* Hide the loader when Flutter is ready */
    .flutter-ready .loader-container {
      display: none;
    }
  </style>
</head>

<body>
  <div id="loading-indicator" class="loader-container">
    <div class="loader-box">
      <div class="inner-square"></div>
    </div>
    <div class="loader-text">Initializing OS...</div>
    <div class="progress-bar">
      <div class="progress-inner"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    function removeLoader() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.transition = 'opacity 0.5s ease';
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 500);
      }
    }
  </script>
</body>

</html>
